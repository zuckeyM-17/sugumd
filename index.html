<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sugumd</title>
    <meta name="description" content="すぐ書けて、すぐ整って、すぐコピーできる。ブラウザだけで動く Markdown エディター" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232f6feb'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>M↓</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <button id="toggle-sidebar" class="btn btn-ghost icon-btn only-narrow" type="button" aria-label="ドキュメント一覧を開く">☰</button>
      <span class="brand">sugumd</span>
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button id="toggle-raw" class="btn btn-ghost" type="button" aria-pressed="false">Markdown表示</button>
      <button id="copy-all" class="btn btn-primary" type="button">全体をコピー</button>
      <details id="more-menu" class="menu">
        <summary class="btn btn-ghost icon-btn" aria-label="その他の操作">…</summary>
        <div class="menu-list" role="menu">
          <button type="button" role="menuitem" data-action="copy-markdown">Markdown テキストだけコピー</button>
          <button type="button" role="menuitem" data-action="download-md">このドキュメントを .md で保存</button>
          <hr />
          <button type="button" role="menuitem" data-action="export-backup">全ドキュメントのバックアップを書き出す</button>
          <button type="button" role="menuitem" data-action="import-backup">バックアップから復元…</button>
        </div>
      </details>
      <input id="import-input" type="file" accept="application/json,.json" hidden />
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="ドキュメント一覧">
        <button id="new-doc" class="btn btn-new" type="button">＋ 新しいドキュメント</button>
        <ul id="doc-list" class="doc-list"></ul>
      </aside>

      <main id="editor-scroll" class="editor-scroll">
        <div id="editor" class="editor"></div>
        <textarea id="raw" class="raw" hidden spellcheck="false" aria-label="Markdown ソース"></textarea>
      </main>

      <aside class="toc-pane" aria-label="目次">
        <div class="toc-heading">目次</div>
        <nav id="toc" class="toc"></nav>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
