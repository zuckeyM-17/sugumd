<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>sugumd</title>
    <meta name="description" content="Write fast, see it formatted, copy it anywhere. A Markdown editor that runs entirely in your browser." />
    <!-- ホーム画面に追加したときにアプリとして開くための設定 -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="sugumd" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // 描画前にテーマを決めて、ダーク設定の人に一瞬明るい画面が見えないようにする（src/theme.js と同じ判定）
      ;(function () {
        var pref = null
        try { pref = localStorage.getItem('sugumd:theme') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = dark ? '#191919' : '#ffffff'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  </head>
  <body>
    <header class="topbar">
      <button id="toggle-sidebar" class="btn btn-ghost icon-btn only-narrow" type="button" aria-label="Open document list">☰</button>
      <span class="brand">sugumd</span>
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button id="folder-status" class="btn btn-ghost folder-status" type="button" hidden></button>
      <div id="mode-toggle" class="mode-toggle" role="radiogroup" aria-label="Editor mode" data-mode="rich">
        <button type="button" role="radio" data-mode="rich" aria-checked="true" title="Formatted editing">Rich</button>
        <button type="button" role="radio" data-mode="markdown" aria-checked="false" tabindex="-1" title="Edit raw Markdown (Ctrl+Shift+M)">Markdown</button>
      </div>
      <button id="copy-all" class="btn btn-primary" type="button"><span class="label-long">Copy all</span><span class="label-short">Copy</span></button>
      <button id="toggle-toc" class="btn btn-ghost icon-btn only-narrow-toc" type="button" aria-label="Open outline" aria-expanded="false" title="Outline">☷</button>
      <details id="more-menu" class="menu">
        <summary class="btn btn-ghost icon-btn" aria-label="More actions">…</summary>
        <div class="menu-list" role="menu">
          <button type="button" role="menuitem" data-action="copy-markdown">Copy as Markdown text</button>
          <button type="button" role="menuitem" data-action="copy-slack">Copy for Slack</button>
          <button type="button" role="menuitem" data-action="download-md">Download as .md</button>
          <hr />
          <button type="button" role="menuitem" data-action="export-backup">Export backup (all documents)</button>
          <button type="button" role="menuitem" data-action="import-backup">Restore from backup…</button>
          <hr />
          <button type="button" role="menuitem" data-action="folder-choose">Also save to a folder…</button>
          <button type="button" role="menuitem" data-action="folder-disconnect" hidden>Disconnect folder</button>
          <hr />
          <div class="menu-label" id="theme-label">Theme</div>
          <div role="group" aria-labelledby="theme-label">
            <button type="button" role="menuitemradio" data-action="theme-system" aria-checked="true">Match system</button>
            <button type="button" role="menuitemradio" data-action="theme-light" aria-checked="false">Light</button>
            <button type="button" role="menuitemradio" data-action="theme-dark" aria-checked="false">Dark</button>
          </div>
        </div>
      </details>
      <input id="import-input" type="file" accept="application/json,.json" hidden />
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Documents">
        <button id="new-doc" class="btn btn-new" type="button">+ New document</button>
        <input id="doc-search" class="doc-search" type="search" placeholder="Search (Ctrl+K)" aria-label="Search documents" />
        <button id="open-todos" class="btn btn-new todo-open" type="button" aria-pressed="false">☑ To-dos</button>
        <ul id="doc-list" class="doc-list"></ul>
      </aside>

      <main id="editor-scroll" class="editor-scroll">
        <div id="editor" class="editor"></div>
        <section id="todo-view" class="todo-view" hidden aria-label="To-dos"></section>
        <textarea id="raw" class="raw" hidden spellcheck="false" aria-label="Markdown source"></textarea>
      </main>

      <aside class="toc-pane" aria-label="Outline">
        <div class="toc-heading">Outline</div>
        <nav id="toc" class="toc"></nav>
      </aside>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
